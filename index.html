<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <title>Ideas de Regalos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF9F6;
      --surface: #FFFFFF;
      --surface-muted: #F3F1EC;
      --border: #E7E5E0;
      --text: #18181B;
      --text-muted: #52525B;
      --primary: #0F766E;
      --primary-dark: #115E59;
      --primary-soft: #CCFBF1;
      --success: #15803D;
      --success-soft: #DCFCE7;
      --danger: #B91C1C;
      --danger-soft: #FEF2F2;
      --radius: 20px;
      --shadow-sm: 0 2px 10px rgba(24, 24, 27, 0.05);
      --shadow-md: 0 18px 40px rgba(24, 24, 27, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1, h2, .lock-title, .modal-header h2, .brand h1, .empty-state h2 {
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
      letter-spacing: -0.02em;
    }

    .hidden {
      display: none !important;
    }

    button, input, select {
      font-family: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ================= PANTALLA DE BLOQUEO (PIN) ================= */
    #lock-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(120% 90% at 50% -10%, #FFFFFF 0%, #FAF9F6 55%, #F3F1EC 100%);
    }

    .lock-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .lock-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .lock-title {
      margin: 0 0 6px;
      font-size: 1.75rem;
      line-height: 1.15;
      font-weight: 700;
      color: var(--text);
    }

    .lock-subtitle {
      margin: 0 0 24px;
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid #D4D4D8;
      background: transparent;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .pin-dot.filled {
      background: var(--primary);
      border-color: var(--primary);
      transform: scale(1.1);
    }

    .pin-dots.shake {
      animation: pinShake 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
    }

    .pin-error,
    .pin-status {
      min-height: 22px;
      margin: 0 0 16px;
      font-size: 0.86rem;
      font-weight: 600;
    }

    .pin-error {
      color: var(--danger);
    }

    .pin-status {
      color: var(--text-muted);
      font-weight: 500;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 288px;
      margin: 0 auto;
    }

    .key-btn {
      height: 64px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background-color 0.15s ease;
      user-select: none;
    }

    .key-btn:active {
      transform: scale(0.95);
      background: var(--surface-muted);
    }

    .key-btn.key-action {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .key-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ================= APP PRINCIPAL ================= */
    #app-screen {
      padding-bottom: calc(104px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(250, 249, 246, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-pill {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-pill.primary-outline {
      border-color: #99F6E4;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .btn-pill.primary-outline:hover {
      border-color: var(--primary);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .btn-icon:hover {
      color: var(--text);
      border-color: #D4D4D8;
    }

    /* Pestañas dinámicas de personas */
    .tabs-bar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .tabs-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex-shrink: 0;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .tab-btn.active {
      background: var(--text);
      border-color: var(--text);
      color: #FFFFFF;
    }

    .tab-count {
      font-size: 0.76rem;
      opacity: 0.7;
    }

    .tab-btn.active .tab-count {
      opacity: 0.85;
    }

    /* Contenedor principal y galería */
    .main-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 16px 24px;
    }

    .summary-line {
      margin: 0 0 14px;
      font-size: 0.88rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .gifts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .gifts-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .gifts-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
    }

    .gift-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .gift-card:hover {
      box-shadow: 0 10px 26px rgba(24, 24, 27, 0.08);
    }

    .gift-card.purchased {
      opacity: 0.72;
    }

    .gift-photo-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--surface-muted);
      overflow: hidden;
    }

    .gift-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
      transition: transform 0.35s ease;
    }

    .gift-card:hover .gift-photo {
      transform: scale(1.03);
    }

    .gift-photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #A1A1AA;
      font-size: 2rem;
      background: linear-gradient(135deg, #F5F5F4 0%, #FAF9F6 100%);
    }

    .gift-photo-placeholder span {
      font-size: 0.8rem;
      font-weight: 600;
    }

    .purchased-ribbon {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--surface);
      color: var(--success);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #BBF7D0;
      box-shadow: var(--shadow-sm);
    }

    .gift-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .gift-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .person-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .price-badge {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .gift-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      word-break: break-word;
    }

    .gift-card.purchased .gift-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .gift-actions {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gift-actions-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .btn-link {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .btn-link:hover {
      border-color: #D4D4D8;
      background: var(--surface-muted);
    }

    .btn-buy-toggle {
      flex: 1;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn-buy-toggle:hover {
      background: var(--surface-muted);
    }

    .btn-buy-toggle.is-bought {
      background: var(--success-soft);
      border-color: #86EFAC;
      color: var(--success);
    }

    .btn-delete {
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid #FECACA;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-delete:hover {
      border-color: #FCA5A5;
    }

    /* Estado vacío */
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      max-width: 460px;
      margin: 24px auto;
    }

    .empty-state-icon {
      font-size: 2.6rem;
      margin-bottom: 10px;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
    }

    .empty-state p {
      margin: 0 auto;
      max-width: 36ch;
      font-size: 0.94rem;
      line-height: 1.5;
    }

    /* Botón flotante (+ Añadir regalo) */
    .fab {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 40;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 16px;
      border: none;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 0.96rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease;
    }

    .fab:hover {
      background: var(--primary-dark);
    }

    .fab:active {
      transform: translateX(-50%) scale(0.97);
    }

    /* ================= MODALES ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(24, 24, 27, 0.52);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 500px;
      max-height: 92dvh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-md);
    }

    @media (min-width: 640px) {
      .modal-sheet {
        border-radius: 24px;
        padding: 24px;
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }

    .modal-close {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-close:hover {
      background: var(--surface-muted);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .form-control {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .inline-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-secondary {
      min-height: 46px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--surface-muted);
    }

    .btn-primary {
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-danger-full {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      border: none;
      background: var(--danger);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Subida y previsualización de foto */
    .upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 18px;
      border: 1.5px dashed #D4D4D8;
      border-radius: 14px;
      background: var(--bg);
      cursor: pointer;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .upload-box:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .preview-wrap {
      position: relative;
      margin-top: 10px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .preview-wrap img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
    }

    .preview-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: none;
      background: rgba(24, 24, 27, 0.78);
      color: #FFFFFF;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .preview-info {
      padding: 6px 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface);
    }

    /* Lista dentro de modal de personas */
    .people-list {
      list-style: none;
      padding: 0;
      margin: 16px 0 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .person-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.92rem;
    }

    .person-del-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #FECACA;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Visor de imagen ampliada */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      cursor: zoom-out;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 90dvh;
      border-radius: 14px;
      object-fit: contain;
    }

    /* Toast de feedback */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(86px + env(safe-area-inset-bottom));

  <script type="module">

    // =========================================================================
    // CONFIGURACIÓN DE FIREBASE (PEGA AQUÍ TUS CLAVES PÚBLICAS DE FIREBASE)
    // NO ESCRIBAS NINGÚN PIN SECRETO EN ESTE ARCHIVO
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAfOJA_RO3wiLJQ_wR7gCyDH4jCbpZJkpo",
      authDomain: "giftbox-b032e.firebaseapp.com",
      projectId: "giftbox-b032e",
      storageBucket: "giftbox-b032e.firebasestorage.app",
      messagingSenderId: "391994539931",

    };
    // =========================================================================

    const STORAGE_PIN_KEY = "regalos_familiares_pin";
    const isConfigPending = Object.values(firebaseConfig).some((v) => String(v).startsWith("TU_"));

    const app = initializeApp(firebaseConfig);

    // Estado en memoria

    // Referencias DOM

    const lightbox = document.getElementById("lightbox");

    // ================= UTILIDADES =================
    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.add("hidden"), 2600);
    }

    // Firestore guarda createdAt como número en las reglas actuales
    function toMillis(value) {
      if (typeof value === "number") return value;
      if (value && typeof value.toMillis === "function") return value.toMillis();
      if (value && typeof value.seconds === "number") return value.seconds * 1000;
      return 0;
    }

    function openModal(el) {
      el.classList.remove("hidden");
    }

    function closeModal(el) {
      el.classList.add("hidden");
    }

    function sanitizeUrl(rawUrl) {
      const trimmed = (rawUrl || "").trim();
      if (!trimmed) return "";
      const withProtocol = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
      try {
        const parsed = new URL(withProtocol);
        if (parsed.protocol === "http:" || parsed.protocol === "https:") {
          return parsed.href;
        }
      } catch (_) {}
      return "";
    }

    function formatPrice(value) {
      if (value === null || value === undefined || value === "") return "";
      const num = Number(value);
      if (Number.isNaN(num)) return "";
      return `${num.toLocaleString("es-ES", { minimumFractionDigits: 0, maximumFractionDigits: 2 })} €`;
    }

    // Las reglas de Firestore permiten imageUrl de hasta 550000 caracteres
    const MAX_IMAGE_DATAURL_LENGTH = 540000;

    // Compresión de imagen en cliente con Canvas para guardar en Firestore (< 550 KB)
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          const renderAttempt = (maxWidth, quality) => {
            let width = img.naturalWidth || img.width;
            let height = img.naturalHeight || img.height;

            if (width > maxWidth) {
              height = Math.round(height * (maxWidth / width));
              width = maxWidth;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            return { dataUrl, width, height };
          };

          const attempts = [
            [800, 0.7],
            [700, 0.6],
            [600, 0.55],
            [520, 0.45],
            [420, 0.4],
            [320, 0.35]
          ];

          let result = null;
          for (const [maxWidth, quality] of attempts) {
            result = renderAttempt(maxWidth, quality);
            if (result.dataUrl.length <= MAX_IMAGE_DATAURL_LENGTH) break;
          }

          if (!result || result.dataUrl.length > MAX_IMAGE_DATAURL_LENGTH) {
            reject(new Error("La imagen es demasiado pesada, prueba con otra foto"));
            return;
          }

          const approxBytes = Math.round((result.dataUrl.length - result.dataUrl.indexOf(",") - 1) * 0.75);
          resolve({ ...result, byteSize: approxBytes });
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("El archivo no es una imagen válida"));
        };
        img.src = objectUrl;
      });
    }

    // ================= LÓGICA DE PIN Y ACCESO =================
    function renderPinDots() {
      pinDots.forEach((dot, idx) => {
        dot.classList.toggle("filled", idx < enteredPin.length);
      });
    }

    function setVerifyingState(loading) {
      isVerifying = loading;
      pinStatus.classList.toggle("hidden", !loading);
      keypad.querySelectorAll("button").forEach((b) => {
        b.disabled = loading;
      });
    }

    function triggerPinError(message) {
      enteredPin = "";
      renderPinDots();
      pinError.textContent = message;
      pinDotsWrap.classList.remove("shake");
      void pinDotsWrap.offsetWidth; // Reiniciar animación
      pinDotsWrap.classList.add("shake");
    }

    async function verifyAndUnlock(pin) {
      if (isConfigPending) {
        triggerPinError("Configura primero firebaseConfig en index.html");
        return;
      }

      setVerifyingState(true);
      pinError.textContent = "";

      try {
        if (!auth.currentUser) {
          await signInAnonymously(auth);
        }

        // Intentar leer la ruta protegida por reglas de Firebase
        await getDocs(query(collection(db, "listas_regalos", pin, "items"), limit(1)));

        // Si Firebase permitió la lectura, el PIN es correcto
        activePin = pin;
        localStorage.setItem(STORAGE_PIN_KEY, pin);
        enterApp();
      } catch (error) {
        localStorage.removeItem(STORAGE_PIN_KEY);
        if (error && (error.code === "permission-denied" || String(error.message).includes("permissions"))) {
          triggerPinError("PIN incorrecto. Inténtalo de nuevo.");
        } else {
          console.error(error);
          triggerPinError("Error de conexión con Firebase.");
        }
      } finally {
        setVerifyingState(false);
      }
    }

    function handleDigit(digit) {
      if (isVerifying || enteredPin.length >= 4) return;
      pinError.textContent = "";
      enteredPin += digit;
      renderPinDots();
      if (enteredPin.length === 4) {
        verifyAndUnlock(enteredPin);
      }
    }

    function lockApp() {
      if (unsubPeople) { unsubPeople(); unsubPeople = null; }
      if (unsubGifts) { unsubGifts(); unsubGifts = null; }
      activePin = null;
      people = [];
      gifts = [];
      selectedPersonFilter = "ALL";
      localStorage.removeItem(STORAGE_PIN_KEY);
      enteredPin = "";
      renderPinDots();
      pinError.textContent = "";
      appScreen.classList.add("hidden");
      lockScreen.classList.remove("hidden");
    }

    keypad.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn || isVerifying) return;
      const digit = btn.dataset.key;
      if (digit !== undefined) {
        handleDigit(digit);
      }
    });

    document.getElementById("btn-pin-clear").addEventListener("click", () => {
      if (isVerifying) return;
      enteredPin = "";
      pinError.textContent = "";
      renderPinDots();
    });

    document.getElementById("btn-pin-back").addEventListener("click", () => {
      if (isVerifying || enteredPin.length === 0) return;
      enteredPin = enteredPin.slice(0, -1);
      pinError.textContent = "";
      renderPinDots();
    });

    document.addEventListener("keydown", (e) => {
      if (lockScreen.classList.contains("hidden") || isVerifying) return;
      if (/^[0-9]$/.test(e.key)) {
        handleDigit(e.key);
      } else if (e.key === "Backspace") {
        enteredPin = enteredPin.slice(0, -1);
        renderPinDots();
      } else if (e.key === "Escape") {
        enteredPin = "";
        renderPinDots();
      }
    });

    document.getElementById("btn-lock-app").addEventListener("click", lockApp);

    // ================= SINCRONIZACIÓN EN TIEMPO REAL =================
    function enterApp() {
      lockScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");
      subscribeRealtime();
    }

    function subscribeRealtime() {
      if (unsubPeople) unsubPeople();
      if (unsubGifts) unsubGifts();

      const peopleQuery = query(
        collection(db, "listas_regalos", activePin, "personas"),
        orderBy("createdAt", "asc")
      );

      unsubPeople = onSnapshot(
        peopleQuery,
        (snapshot) => {
          people = snapshot.docs
            .map((d) => {
              const data = d.data();
              return { id: d.id, ...data, nombre: data.nombre ?? data.name ?? "" };
            })
            .filter((p) => p.nombre);
          if (selectedPersonFilter !== "ALL" && !people.some((p) => p.id === selectedPersonFilter)) {
            selectedPersonFilter = "ALL";
          }
          renderTabs();
          renderGifts();
          renderPeopleModalList();
          refreshGiftPersonSelect();
        },
        (err) => {
          console.error(err);
          if (err.code === "permission-denied") {
            lockApp();
            triggerPinError("Sesión caducada o PIN modificado.");
          }
        }
      );

      const giftsQuery = query(
        collection(db, "listas_regalos", activePin, "items"),
        orderBy("createdAt", "desc")
      );

      unsubGifts = onSnapshot(
        giftsQuery,
        (snapshot) => {
          // Compatibilidad: acepta documentos nuevos y los creados por la versión "Regalos en Familia"
          gifts = snapshot.docs.map((d) => {
            const data = d.data();
            return {
              id: d.id,
              ...data,
              nombre: data.nombre ?? data.name ?? "",
              precio: data.precio ?? data.price ?? null,
              fotoUrl: data.fotoUrl ?? data.imageUrl ?? "",
              enlace: data.enlace ?? data.storeUrl ?? "",
              comprado: data.comprado ?? data.purchased ?? false,
              personaId: data.personaId ?? "",
              personaNombre: data.personaNombre ?? data.familyMember ?? ""
            };
          });
          renderTabs();
          renderGifts();
        },
        (err) => {
          console.error(err);
          if (err.code === "permission-denied") {
            lockApp();
            triggerPinError("Sesión caducada o PIN modificado.");
          }
        }
      );
    }

    // ================= RENDERIZADO DE PESTAÑAS Y PERSONAS =================
    function giftMatchesPerson(gift, personId) {
      const person = people.find((p) => p.id === personId);
      if (!person) return false;
      if (gift.personaId) return gift.personaId === person.id;
      // Regalos antiguos sin personaId: se emparejan por nombre
      return (gift.personaNombre || "").toLowerCase() === person.nombre.toLowerCase();
    }

    function renderTabs() {
      tabsBar.innerHTML = "";

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = `tab-btn${selectedPersonFilter === "ALL" ? " active" : ""}`;
      allBtn.textContent = "Todos ";
      const allCount = document.createElement("span");
      allCount.className = "tab-count";
      allCount.textContent = `(${gifts.length})`;
      allBtn.appendChild(allCount);
      allBtn.addEventListener("click", () => {
        selectedPersonFilter = "ALL";
        renderTabs();
        renderGifts();
      });
      tabsBar.appendChild(allBtn);

      people.forEach((person) => {
        const count = gifts.filter((g) => giftMatchesPerson(g, person.id)).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `tab-btn${selectedPersonFilter === person.id ? " active" : ""}`;
        btn.textContent = `${person.nombre} `;
        const countSpan = document.createElement("span");
        countSpan.className = "tab-count";
        countSpan.textContent = `(${count})`;
        btn.appendChild(countSpan);
        btn.addEventListener("click", () => {
          selectedPersonFilter = person.id;
          renderTabs();
          renderGifts();
        });
        tabsBar.appendChild(btn);
      });
    }

    function renderPeopleModalList() {
      peopleListEl.innerHTML = "";
      if (people.length === 0) {
        peopleEmptyMsg.textContent = "Todavía no hay personas añadidas. Crea la primera arriba.";
        return;
      }
      peopleEmptyMsg.textContent = "";

      people.forEach((person) => {
        const li = document.createElement("li");
        li.className = "person-item";

        const nameSpan = document.createElement("span");
        nameSpan.textContent = person.nombre;

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "person-del-btn";
        delBtn.textContent = "Eliminar";
        delBtn.addEventListener("click", () => {
          askConfirm(
            "Eliminar persona",
            `¿Quieres eliminar a "${person.nombre}" de la lista de personas? Sus regalos guardados seguirán viéndose en "Todos".`,
            async () => {
              await deleteDoc(doc(db, "listas_regalos", activePin, "personas", person.id));
              showToast("Persona eliminada");
            }
          );
        });

        li.appendChild(nameSpan);
        li.appendChild(delBtn);
        peopleListEl.appendChild(li);
      });
    }

    function refreshGiftPersonSelect(preferredId = null) {
      const currentVal = preferredId || giftPersonSelect.value;
      giftPersonSelect.innerHTML = "";

      if (people.length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Sin personas aún — añade una nueva";
        giftPersonSelect.appendChild(opt);
        inlinePersonBox.classList.remove("hidden");
      } else {
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Selecciona una persona...";
        giftPersonSelect.appendChild(placeholder);

        people.forEach((person) => {
          const opt = document.createElement("option");
          opt.value = person.id;
          opt.textContent = person.nombre;
          giftPersonSelect.appendChild(opt);
        });

        if (currentVal && people.some((p) => p.id === currentVal)) {
          giftPersonSelect.value = currentVal;
        } else if (selectedPersonFilter !== "ALL" && people.some((p) => p.id === selectedPersonFilter)) {
          giftPersonSelect.value = selectedPersonFilter;
        }
      }
    }

    async function ensurePersonExists(name) {
      const cleanName = name.trim();
      const existing = people.find(
        (p) => p.nombre.toLowerCase() === cleanName.toLowerCase()
      );
      if (existing) return existing;

      // Los nombres de campo deben coincidir con las reglas de Firestore
      const docRef = await addDoc(collection(db, "listas_regalos", activePin, "personas"), {
        name: cleanName,
        createdAt: Date.now()
      });
      return { id: docRef.id, nombre: cleanName };
    }

    // ================= RENDERIZADO DE TARJETAS DE REGALO =================
    function renderGifts() {
      giftsGrid.innerHTML = "";

      const filtered = selectedPersonFilter === "ALL"
        ? [...gifts]
        : gifts.filter((g) => giftMatchesPerson(g, selectedPersonFilter));

      // No comprados primero; comprados al final
      filtered.sort((a, b) => {
        if (Boolean(a.comprado) !== Boolean(b.comprado)) {
          return a.comprado ? 1 : -1;
        }
        const tA = toMillis(a.createdAt);
        const tB = toMillis(b.createdAt);
        return tB - tA;
      });

      const boughtCount = filtered.filter((g) => g.comprado).length;
      summaryLine.textContent = `${filtered.length} ${filtered.length === 1 ? "idea" : "ideas"} · ${boughtCount} ${boughtCount === 1 ? "comprado" : "comprados"}`;

      if (filtered.length === 0) {
        emptyState.classList.remove("hidden");
        emptyState.innerHTML = "";
        const icon = document.createElement("div");
        icon.className = "empty-state-icon";
        icon.textContent = people.length === 0 ? "👨‍👩‍👧‍👦" : "🎁";

        const h2 = document.createElement("h2");
        h2.textContent = people.length === 0
          ? "Empezad creando vuestra lista"
          : "No hay ideas de regalo aquí";

        const p = document.createElement("p");
        p.textContent = people.length === 0
          ? "Añade una persona con el botón \"+ Persona\" o pulsa \"+ Añadir regalo\" para guardar la primera idea."
          : "Pulsa \"+ Añadir regalo\" para guardar una nueva idea y compartirla al instante.";

        emptyState.appendChild(icon);
        emptyState.appendChild(h2);
        emptyState.appendChild(p);
        return;
      }

      emptyState.classList.add("hidden");

      filtered.forEach((item) => {
        const card = document.createElement("article");
        card.className = `gift-card${item.comprado ? " purchased" : ""}`;

        // Foto superior
        const photoWrap = document.createElement("div");
        photoWrap.className = "gift-photo-wrap";

        if (item.fotoUrl) {
          const img = document.createElement("img");
          img.className = "gift-photo";
          img.src = item.fotoUrl;
          img.alt = item.nombre || "Foto del regalo";
          img.loading = "lazy";
          img.addEventListener("click", () => {
            lightboxImg.src = item.fotoUrl;
            openModal(lightbox);
          });
          photoWrap.appendChild(img);
        } else {
          const ph = document.createElement("div");
          ph.className = "gift-photo-placeholder";
          ph.innerHTML = "🎁<span>Sin foto</span>";
          photoWrap.appendChild(ph);
        }

        if (item.comprado) {
          const ribbon = document.createElement("span");
          ribbon.className = "purchased-ribbon";
          ribbon.textContent = "✓ Comprado";
          photoWrap.appendChild(ribbon);
        }

        // Cuerpo de la tarjeta
        const body = document.createElement("div");
        body.className = "gift-body";

        const meta = document.createElement("div");
        meta.className = "gift-meta";

        const personBadge = document.createElement("span");
        personBadge.className = "person-badge";
        const linkedPerson = people.find((p) => p.id === item.personaId);
        personBadge.textContent = linkedPerson ? linkedPerson.nombre : (item.personaNombre || "Sin asignar");
        meta.appendChild(personBadge);

        const formattedPrice = formatPrice(item.precio);
        if (formattedPrice) {
          const priceEl = document.createElement("span");
          priceEl.className = "price-badge";
          priceEl.textContent = formattedPrice;
          meta.appendChild(priceEl);
        }

        const title = document.createElement("h3");
        title.className = "gift-title";
        title.textContent = item.nombre;

        const actions = document.createElement("div");
        actions.className = "gift-actions";

        const safeHref = sanitizeUrl(item.enlace);
        if (safeHref) {
          const linkBtn = document.createElement("a");
          linkBtn.className = "btn-link";
          linkBtn.href = safeHref;
          linkBtn.target = "_blank";
          linkBtn.rel = "noopener noreferrer";
          linkBtn.textContent = "🛒 Abrir enlace de compra";
          actions.appendChild(linkBtn);
        }

        const actionsRow = document.createElement("div");
        actionsRow.className = "gift-actions-row";

        const buyBtn = document.createElement("button");
        buyBtn.type = "button";
        buyBtn.className = `btn-buy-toggle${item.comprado ? " is-bought" : ""}`;
        buyBtn.textContent = item.comprado ? "☑ Comprado" : "☐ Marcar como Comprado";
        buyBtn.addEventListener("click", async () => {
          buyBtn.disabled = true;
          try {
            await updateDoc(doc(db, "listas_regalos", activePin, "items", item.id), {
              purchased: !item.comprado
            });
          } catch (err) {
            console.error(err);
            showToast("No se pudo actualizar el estado");
          } finally {
            buyBtn.disabled = false;
          }
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn-delete";
        delBtn.title = "Eliminar regalo";
        delBtn.ariaLabel = "Eliminar regalo";
        delBtn.textContent = "🗑";
        delBtn.addEventListener("click", () => {
          askConfirm(
            "Eliminar regalo",
            `¿Seguro que quieres borrar "${item.nombre}"?`,
            async () => {
              await deleteDoc(doc(db, "listas_regalos", activePin, "items", item.id));
              showToast("Regalo eliminado");
            }
          );
        });

        actionsRow.appendChild(buyBtn);
        actionsRow.appendChild(delBtn);
        actions.appendChild(actionsRow);

        body.appendChild(meta);
        body.appendChild(title);
        body.appendChild(actions);

        card.appendChild(photoWrap);
        card.appendChild(body);
        giftsGrid.appendChild(card);
      });
    }

    // ================= EVENTOS DE MODALES Y FORMULARIOS =================
    document.querySelectorAll("[data-close-modal]").forEach((btn) => {
      btn.addEventListener("click", () => {
        closeModal(document.getElementById(btn.dataset.closeModal));
      });
    });

    [modalGift, modalPeople, modalConfirm].forEach((backdrop) => {
      backdrop.addEventListener("click", (e) => {
        if (e.target === backdrop) closeModal(backdrop);
      });
    });

    lightbox.addEventListener("click", () => closeModal(lightbox));

    function askConfirm(title, message, onConfirm) {
      confirmTitle.textContent = title;
      confirmMessage.textContent = message;
      pendingConfirmAction = onConfirm;
      openModal(modalConfirm);
    }

    btnConfirmYes.addEventListener("click", async () => {
      if (!pendingConfirmAction) return;
      btnConfirmYes.disabled = true;
      try {
        await pendingConfirmAction();
        closeModal(modalConfirm);
      } catch (err) {
        console.error(err);
        showToast("Ocurrió un error al eliminar");
      } finally {
        btnConfirmYes.disabled = false;
        pendingConfirmAction = null;
      }
    });

    // Modal de Personas
    document.getElementById("btn-open-people").addEventListener("click", () => {
      renderPeopleModalList();
      openModal(modalPeople);
      personNameInput.focus();
    });

    formPerson.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = personNameInput.value.trim();
      if (!name) return;

      const submitBtn = formPerson.querySelector("button[type='submit']");
      submitBtn.disabled = true;
      try {
        await ensurePersonExists(name);
        personNameInput.value = "";
        showToast("Persona añadida");
      } catch (err) {
        console.error(err);
        showToast("Error al guardar la persona");
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Modal de Regalo
    function resetGiftForm() {
      formGift.reset();
      compressedPhotoDataUrl = "";
      photoPreviewImg.src = "";
      photoPreviewWrap.classList.add("hidden");
      inlinePersonBox.classList.toggle("hidden", people.length > 0);
      refreshGiftPersonSelect();
    }

    document.getElementById("btn-open-add-gift").addEventListener("click", () => {
      resetGiftForm();
      openModal(modalGift);
    });

    btnToggleInlinePerson.addEventListener("click", () => {
      inlinePersonBox.classList.toggle("hidden");
      if (!inlinePersonBox.classList.contains("hidden")) {
        giftPersonSelect.value = "";
        giftNewPersonInput.focus();
      }
    });

    giftPersonSelect.addEventListener("change", () => {
      if (giftPersonSelect.value) {
        inlinePersonBox.classList.add("hidden");
        giftNewPersonInput.value = "";
      }
    });

    giftPhotoInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      try {
        const { dataUrl, byteSize, width, height } = await compressImage(file);
        compressedPhotoDataUrl = dataUrl;
        photoPreviewImg.src = dataUrl;
        const kb = Math.max(1, Math.round(byteSize / 1024));
        photoPreviewInfo.textContent = `Optimizada (${width}×${height} px · ${kb} KB)`;
        photoPreviewWrap.classList.remove("hidden");
      } catch (err) {
        console.error(err);
        showToast(err?.message || "No se pudo procesar la imagen");
        giftPhotoInput.value = "";
      }
    });

    document.getElementById("btn-remove-photo").addEventListener("click", () => {
      compressedPhotoDataUrl = "";
      giftPhotoInput.value = "";
      photoPreviewImg.src = "";
      photoPreviewWrap.classList.add("hidden");
    });

    formGift.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!activePin) return;

      const title = giftTitleInput.value.trim();
      if (!title) {
        showToast("Escribe el nombre del regalo");
        return;
      }

      const inlineName = giftNewPersonInput.value.trim();
      const selectedId = giftPersonSelect.value;

      if (!selectedId && !inlineName) {
        showToast("Selecciona o añade una persona");
        inlinePersonBox.classList.remove("hidden");
        giftNewPersonInput.focus();
        return;
      }

      btnSaveGift.disabled = true;
      btnSaveGift.textContent = "Guardando...";

      try {
        let targetPerson;
        if (inlineName) {
          targetPerson = await ensurePersonExists(inlineName);
        } else {
          targetPerson = people.find((p) => p.id === selectedId);
        }

        if (!targetPerson) {
          throw new Error("Persona no válida");
        }

        const fotoUrl = compressedPhotoDataUrl || "";
        const priceRaw = giftPriceInput.value.trim();
        const precio = priceRaw === "" ? null : Number(priceRaw);
        const enlace = sanitizeUrl(giftLinkInput.value);

        // Campos obligatorios según las reglas de Firestore de este proyecto
        await addDoc(collection(db, "listas_regalos", activePin, "items"), {
          familyMember: targetPerson.nombre,
          name: title,
          price: Number.isNaN(precio) ? null : precio,
          storeUrl: enlace,
          imageUrl: fotoUrl,
          purchased: false,
          createdAt: Date.now()
        });

        closeModal(modalGift);
        resetGiftForm();
        showToast("Regalo guardado");
      } catch (err) {
        console.error(err);
        showToast("Error al guardar el regalo");
      } finally {
        btnSaveGift.disabled = false;
        btnSaveGift.textContent = "Guardar regalo";
      }
    });

    // ================= AUTO-LOGIN AL CARGAR =================
    const savedPin = localStorage.getItem(STORAGE_PIN_KEY);
    if (savedPin && /^\d{4}$/.test(savedPin) && !isConfigPending) {
      enteredPin = savedPin;
      renderPinDots();
      verifyAndUnlock(savedPin);
    }
  </script>
</body>
</html>
